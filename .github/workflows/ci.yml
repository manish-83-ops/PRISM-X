name: PRISMX CI Pipeline

on:
  push:
    branches: [ "main", "final-v2", "gate15-production" ]
  pull_request:
    branches: [ "main", "final-v2" ]

jobs:
  lint-and-audit:
    name: Lint & Headline Number Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pandas

      - name: Secrets Scan
        run: |
          python scripts/check_secrets.py

      - name: Code Linting
        run: |
          ruff check src/ tests/ scripts/ --select E,F,W --ignore E501

      - name: Recompute and Audit All Headline Numbers
        run: |
          python scripts/verify_report_numbers.py

  unit-tests:
    name: Serving & Retrieval Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Unit Tests (Excluding 100K Store & Live Cluster)
        run: |
          pytest -m "not needs_100k" -v --tb=short
