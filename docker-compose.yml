version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: prismx_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
